name: Gerar animação de contribuições

on:
  push:
    branches: [main]
    paths:
      - "readme.md"
      - ".github/workflows/contribution-animation.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar animação (Asteroids com seus repositórios)
        uses: lucaskawatoko/git-maker/.github/actions/generate-gifs@main
        with:
          username: ${{ vars.GH_USER || github.repository_owner }}
          output: imgs/contribution-animation.gif

      - name: Commitar GIF atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imgs/contribution-animation.gif
          if git diff --cached --quiet; then
            echo "Sem mudanças na animação."
          else
            git commit -m "Atualizar animação de contribuições"
            git push
          fi
