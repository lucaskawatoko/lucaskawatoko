name: Gerar animação de contribuições

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-animation.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar animação (breakout quebrando seus seguidores)
        uses: lucaskawatoko/git-maker/.github/actions/generate-gifs@main
        with:
          username: ${{ vars.GH_USER || github.repository_owner }}
          data: followers
          game: breakout
          smooth: false  # GIF leve (~2.5 MB); true fica mais fluido (~4 MB)
          color: "#aac8d6"  # azul calcinha do fusca
          food: "#e5534b"   # comida vermelha
          output: imgs/contribution-animation.gif

      - name: Cache-busting automático (v = hash do GIF)
        run: |
          GIF_HASH=$(git hash-object imgs/contribution-animation.gif | cut -c1-7)
          sed -i -E \
            's/contribution-animation\.gif\?v=[^"]+/contribution-animation.gif?v='"$GIF_HASH"'/' \
            readme.md
          echo "v=$GIF_HASH"

      - name: Commitar GIF atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imgs/contribution-animation.gif readme.md
          if git diff --cached --quiet; then
            echo "Sem mudanças na animação."
          else
            git commit -m "Atualizar animação de contribuições"
            git push
          fi
